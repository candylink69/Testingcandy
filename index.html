<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>CandyLink69 – Exclusive Videos Hub</title>
    <meta name="description" content="Watch the latest exclusive videos in HD. New categories and trending videos updated daily. All videos and movies are available with subtitles.">
    
    <!-- ✅ CANONICAL FIX -->
    <link rel="canonical" href="https://candylink69.com/" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- ✅ CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Bubble System CSS -->

    <!-- ✅ Icons (Updated Path) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="manifest" href="/icons/site.webmanifest">
</head>
<body>

    <!-- SIDE MENU -->
    <div id="sideMenu"></div>

    <!-- MAIN WRAPPER -->
    <div class="container" id="appContainer">

        <!-- HEADER -->
        <div id="headerContainer"></div>

        <!-- TOP AD -->
        <div id="ad-top" class="ad-spot"></div>

        <!-- SEARCH BAR -->
        <div id="searchContainer"></div>

        <!-- TABS -->
        <div id="tabsWrapper"></div>

        <!-- STATS BAR -->
        <div id="statsBar"></div>

        <!-- PANELS -->
        <div id="latestPanel" class="panel active-panel">
            <div class="pagination-wrapper" id="latestPaginationTop"></div>
            <div id="latestDynamicGrid" class="latest-grid"></div>
            <div class="pagination-wrapper" id="latestPaginationBottom"></div>
        </div>

        <div id="categoriesPanel" class="panel">
            <div class="categories-grid" id="categoriesContainer"></div>
        </div>

        <div id="trendingPanel" class="panel">
            <div class="trending-grid" id="trendingContainer"></div>
        </div>

        <!-- BOTTOM AD -->
        <div id="ad-bottom" class="ad-spot"></div>

        <!-- FOOTER SOCIAL -->
        <div id="footerContainer"></div>

    </div>

    <!-- STICKY AD -->
    <div id="sticky" class="sticky-ad"></div>

    <!-- ========================================= -->
    <!-- SCRIPTS (Updated Paths) -->
    <!-- ========================================= -->
    
    <!-- Data Files (Ab data/ folder mein) -->
    <script src="data/data.js"></script>
    <script src="data/thumbs.js"></script>
    
    <!-- Age Gate -->
    <script src="age-gate.js" async></script>

    <!-- JS Modules -->
    <script src="js/common.js"></script>
    <script src="js/ads.js"></script>
    <script src="js/index.js"></script>

    <!-- Bubble System -->
    <script src="bubble-system/bubble-sounds.js"></script>
    <script src="bubble-system/bubble-core.js"></script>

    <!-- In-App Redirect (Safety) -->
    <script>
        (function() {
            const ua = navigator.userAgent;
            const isTelegram = /Telegram/i.test(ua);
            const isInApp = /FBAN|FBAV|Instagram|Twitter|Snapchat|LinkedIn|Messenger|FBIOS|FB_IAB/i.test(ua);
            const currentUrl = window.location.href;
            const cleanUrl = currentUrl.replace(/^https?:\/\//, '');
            if (isTelegram || isInApp) {
                if (/Android/i.test(ua)) window.location.href = 'intent://' + cleanUrl + '#Intent;scheme=https;action=android.intent.action.VIEW;end';
                else if (/iPhone|iPad|iPod/i.test(ua)) window.location.href = 'x-safari-https://' + cleanUrl;
            }
        })();
    </script>

</body>
</html>
