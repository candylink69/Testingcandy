<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIFs - CandyLink69</title>
    <meta name="description" content="Free GIFs collection on CandyLink69.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="gifs.css">
    <link rel="canonical" href="https://candylink69.com/gifs/">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="manifest" href="/icons/site.webmanifest">
</head>
<body>

    <div id="sideMenu"></div>

    <div class="container">

        <div id="headerContainer"></div>

        <!-- ============ HOME VIEW ============ -->
        <div id="gifsHomeView">
            <h2 class="gifs-main-heading">🎞️ CandyLink69 GIFs 🎞️</h2>

            <div class="gif-type-buttons">
                <a href="?type=captioned" class="gif-type-btn captioned">
                    <span class="gif-type-icon">💬</span>
                    <span class="gif-type-label">Caption GIFs</span>
                </a>
                <a href="?type=normal" class="gif-type-btn normal">
                    <span class="gif-type-icon">🖼️</span>
                    <span class="gif-type-label">Normal GIFs</span>
                </a>
            </div>

            <div class="gifs-mixed-heading">🔥 Latest Mix</div>
            <div id="homeMixedGrid" class="masonry-grid"></div>
            <div class="more-videos-container">
                <button id="homeLoadMoreBtn" class="more-videos-btn" onclick="loadMoreHome()">Load More GIFs ↓</button>
            </div>
        </div>

        <!-- ============ SECTION VIEW (captioned / normal) ============ -->
        <div id="gifsSectionView" style="display:none;">

            <div class="section-top-bar">
    <a href="index.html" class="back-btn">← Back to GIFs</a>
            </div>

            <h2 id="sectionHeading" class="gifs-main-heading">GIFs</h2>

            <div id="searchContainer"></div>

            <div class="swipe-indicator">← swipe →</div>

            <div class="tabs-wrapper">
                <div class="tabs-container">
                    <button class="tab-btn active" data-tab="latest">🔥 LATEST</button>
                    <button class="tab-btn" data-tab="categories">🎯 CATEGORIES</button>
                </div>
                <div class="tabs-underline"></div>
            </div>

            <div id="sectionLatestPanel" class="panel active-panel">
                <div id="sectionLatestGrid" class="masonry-grid"></div>
                <div id="sectionPagination" class="pagination-wrapper"></div>
            </div>

            <div id="sectionCategoriesPanel" class="panel">
                <div id="sectionCategoriesGrid" class="categories-grid"></div>
            </div>

        </div>

        <div id="footerContainer"></div>
    </div>

    <!-- Age Gate -->
    <script src="../age-gate.js" async></script>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="../js/common.js"></script>
    <script src="gifs.js"></script>

</body>
</html>
